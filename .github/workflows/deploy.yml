# =============================================================================
# Hostinger Shared Hosting — Frontend CI/CD (FTP)
# =============================================================================
# Triggers : push to main, manual dispatch
# Deploys  : frontend/dist/ → FRONTEND site public_html via FTP/FTPS
#
# TWO HOSTINGER SITES (do not mix credentials):
#   Frontend  lightsteelblue-bison-593262.hostingersite.com  ← THIS workflow
#   Backend   yellow-cobra-125039.hostingersite.com          ← Node.js Git in hPanel (NOT FTP here)
#
# Secrets  : FTP_* (frontend site only), VITE_API_BASE_URL, SITE_URL, REMOTE_DIR
# =============================================================================

name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no FTP upload)'
        required: false
        default: false
        type: boolean

# Do not cancel in-progress runs — rapid pushes were marking deploys as failed.
concurrency:
  group: hostinger-frontend-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: frontend

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      - name: Build production bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: Cattle Feed ERP
          VITE_API_PROJECT: cattlefeed
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL secret is not set."
            exit 1
          fi
          npm run build
          ls -lah dist/

      - name: Verify dist folder
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'assets/index-' dist/index.html
          echo "Built bundle: $(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"

      - name: Validate frontend FTP credentials
        run: |
          SERVER="${{ secrets.FTP_SERVER }}"
          USER="${{ secrets.FTP_USERNAME }}"
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD must be set."
            exit 1
          fi
          if echo "$SERVER$USER" | grep -qi 'yellow-cobra'; then
            echo "::error::These look like BACKEND (yellow-cobra) FTP credentials."
            echo "::error::This workflow deploys the FRONTEND site (lightsteelblue) only."
            echo "::error::In GitHub Secrets, use FTP from: Websites → lightsteelblue → FTP Accounts"
            exit 1
          fi
          echo "Using frontend FTP host (masked by GitHub)"

      - name: Prepare FTP server path
        id: ftp
        run: |
          DIR="${{ secrets.REMOTE_DIR }}"
          USER="${{ secrets.FTP_USERNAME }}"
          # Hostinger "domain" FTP users (username ends with hostingersite.com) land
          # directly in public_html — there is no nested /public_html folder.
          if [ -z "$DIR" ] || [ "$DIR" = "/public_html" ] || [ "$DIR" = "/public_html/" ] || [ "$DIR" = "./" ] || [ "$DIR" = "." ]; then
            if echo "$USER" | grep -q 'hostingersite.com'; then
              echo "Hostinger domain FTP account detected — using / (FTP root is already public_html)"
              DIR="/"
            elif [ -z "$DIR" ]; then
              echo "::error::REMOTE_DIR secret is not set."
              exit 1
            fi
          fi
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "FTP server-dir: $DIR"
          # Use GITHUB_OUTPUT — ./ breaks GITHUB_ENV parsing (Invalid format error)
          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger FTP
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./frontend/dist/
          server-dir: ${{ steps.ftp.outputs.server_dir }}
          state-name: .ftp-deploy-sync-state-${{ github.run_id }}.json
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Verify live site updated
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          SITE="${SITE_URL:-https://lightsteelblue-bison-593262.hostingersite.com}"
          SITE="${SITE%/}"
          BUILT=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$BUILT" ]; then
            echo "::error::Could not read bundle name from dist/index.html"
            exit 1
          fi
          echo "Deployed bundle should be: $BUILT"
          sleep 15
          LIVE_HTML=$(curl -sL --max-time 30 -H "Cache-Control: no-cache" "$SITE/index.html")
          LIVE=$(echo "$LIVE_HTML" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "Live site bundle: $LIVE"
          JS_URL="$SITE/$LIVE"
          JS_TYPE=$(curl -sI --max-time 30 "$JS_URL" | grep -i '^content-type:' | tr -d '\r' || true)
          JS_SIZE=$(curl -sL --max-time 30 "$JS_URL" | wc -c | tr -d ' ')
          echo "Live bundle content-type: $JS_TYPE (size: $JS_SIZE bytes)"
          if [ "$BUILT" = "$LIVE" ] && echo "$JS_TYPE" | grep -qi 'javascript' && [ "$JS_SIZE" -gt 10000 ]; then
            echo "✅ Live site matches deployed build"
          else
            echo "::error::Live site still shows old or missing bundle ($LIVE vs $BUILT, type: $JS_TYPE, size: $JS_SIZE)."
            echo "::error::Upload frontend/dist/ via Hostinger File Manager → public_html if deploy keeps failing."
            exit 1
          fi

      - name: Skip FTP (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — skipping FTP upload"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
