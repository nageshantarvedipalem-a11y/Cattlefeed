# =============================================================================
# Hostinger Shared Hosting — Frontend CI/CD (FTP)
# =============================================================================
# Triggers : push to main, manual dispatch
# Deploys  : frontend/dist/ → FRONTEND site public_html via FTP/FTPS
#
# TWO HOSTINGER SITES (do not mix credentials):
#   Frontend  lightsteelblue-bison-593262.hostingersite.com  ← THIS workflow
#   Backend   yellow-cobra-125039.hostingersite.com          ← Node.js Git in hPanel (NOT FTP here)
#
# Secrets  : FTP_* (frontend site only), VITE_API_BASE_URL, SITE_URL, REMOTE_DIR
# =============================================================================

name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no FTP upload)'
        required: false
        default: false
        type: boolean

concurrency:
  group: hostinger-frontend-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: frontend

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      - name: Build production bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: Cattle Feed ERP
          VITE_API_PROJECT: cattlefeed
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL secret is not set."
            exit 1
          fi
          npm run build
          ls -lah dist/

      - name: Verify dist folder
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'assets/app-' dist/index.html
          echo "Built bundle: $(grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"

      - name: Validate frontend FTP credentials
        run: |
          SERVER="${{ secrets.FTP_SERVER }}"
          USER="${{ secrets.FTP_USERNAME }}"
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD must be set."
            exit 1
          fi
          if echo "$SERVER$USER" | grep -qi 'yellow-cobra'; then
            echo "::error::These look like BACKEND (yellow-cobra) FTP credentials."
            echo "::error::This workflow deploys the FRONTEND site (lightsteelblue) only."
            exit 1
          fi
          echo "Using frontend FTP host (masked by GitHub)"

      - name: Prepare FTP server path
        id: ftp
        run: |
          DIR="${{ secrets.REMOTE_DIR }}"
          USER="${{ secrets.FTP_USERNAME }}"
          # Hostinger: FTP login root IS public_html. Always deploy to /, never /public_html/.
          if [ -z "$DIR" ] || [ "$DIR" = "/public_html" ] || [ "$DIR" = "/public_html/" ] || [ "$DIR" = "./" ] || [ "$DIR" = "." ] || echo "$USER" | grep -q 'hostingersite.com'; then
            DIR="/"
          fi
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "FTP server-dir: $DIR"
          if echo "${{ secrets.FTP_SERVER }}" | grep -qE '^[0-9.]+$'; then
            echo "ftp_protocol=ftp" >> "$GITHUB_OUTPUT"
            echo "Using plain FTP (IP host avoids SSL certificate mismatch)"
          else
            echo "ftp_protocol=${{ secrets.FTP_PROTOCOL || 'ftp' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger FTP
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_PROTOCOL: ${{ steps.ftp.outputs.ftp_protocol }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          echo "Deploying frontend/dist in one FTP session (${FTP_PROTOCOL}) to avoid Hostinger per-file timeouts"
          cd frontend/dist
          echo "Files to upload: $(find . -type f | wc -l | tr -d ' ')"

          PROTOCOL_SETTINGS='set ftp:ssl-allow no;'
          OPEN_URL="ftp://${FTP_SERVER}:${FTP_PORT}"
          if [ "${FTP_PROTOCOL}" = "ftps" ]; then
            PROTOCOL_SETTINGS='set ftp:ssl-force true; set ssl:verify-certificate no;'
            OPEN_URL="ftps://${FTP_SERVER}:${FTP_PORT}"
          fi

          deploy_once() {
            lftp -c "
              ${PROTOCOL_SETTINGS}
              set ftp:passive-mode true;
              set net:max-retries 8;
              set net:reconnect-interval-base 8;
              set net:timeout 60;
              set net:connection-limit 1;
              set cmd:fail-exit true;
              open -u '${FTP_USERNAME}','${FTP_PASSWORD}' ${OPEN_URL};
              mirror -R --verbose --parallel=1 --no-perms --exclude-glob index.html ./ /;
              put -O / index.html;
              bye
            "
          }

          for attempt in 1 2 3 4 5; do
            echo "FTP mirror attempt ${attempt}/5..."
            if deploy_once; then
              echo "FTP upload succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "FTP attempt ${attempt} failed; waiting before retry..."
            sleep $((attempt * 15))
          done
          echo "::error::FTP upload failed after 5 attempts"
          exit 1

      - name: Verify live site updated
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          SITE="${SITE_URL:-https://dineshcattlefeed.com}"
          SITE="${SITE%/}"
          BUILT=$(grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$BUILT" ]; then
            echo "::error::Could not read bundle name from dist/index.html"
            exit 1
          fi
          echo "Deployed bundle should be: $BUILT"
          LIVE=""
          JS_SIZE=0
          for attempt in 1 2 3 4 5; do
            echo "Verify attempt $attempt/5..."
            sleep 10
            LIVE_HTML=$(curl -sL --max-time 30 -H "Cache-Control: no-cache" "$SITE/index.html")
            LIVE=$(echo "$LIVE_HTML" | grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' | head -1)
            if [ -n "$LIVE" ]; then
              JS_URL="$SITE/$LIVE"
              JS_BODY=$(curl -sL --max-time 30 "$JS_URL" | head -c 20)
              JS_SIZE=$(curl -sL --max-time 30 "$JS_URL" | wc -c | tr -d ' ')
              echo "Live site bundle: $LIVE (${JS_SIZE} bytes)"
              if [ "$BUILT" = "$LIVE" ] && [ "$JS_SIZE" -gt 10000 ] && ! echo "$JS_BODY" | grep -qi '<!doctype'; then
                echo "Live site matches deployed build"
                exit 0
              fi
            else
              echo "Live index.html has no app bundle yet (CDN/cache may be updating)"
            fi
          done
          echo "::warning::Live site verify skipped after retries ($LIVE vs $BUILT, size: $JS_SIZE). FTP upload already succeeded."

      - name: Skip FTP (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — skipping FTP upload"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
