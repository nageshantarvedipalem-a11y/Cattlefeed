# =============================================================================
# Hostinger Shared Hosting — Frontend CI/CD (FTP)
# =============================================================================
# Triggers : push to main, manual dispatch
# Deploys  : frontend/dist/ → FRONTEND site public_html via FTP/FTPS
#
# TWO HOSTINGER SITES (do not mix credentials):
#   Frontend  lightsteelblue-bison-593262.hostingersite.com  ← THIS workflow
#   Backend   yellow-cobra-125039.hostingersite.com          ← Node.js Git in hPanel (NOT FTP here)
#
# Secrets  : FTP_* (frontend site only), VITE_API_BASE_URL, SITE_URL, REMOTE_DIR
# =============================================================================

name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no FTP upload)'
        required: false
        default: false
        type: boolean

concurrency:
  group: hostinger-frontend-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: frontend

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      - name: Build production bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: Cattle Feed ERP
          VITE_API_PROJECT: cattlefeed
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL secret is not set."
            exit 1
          fi
          npm run build
          ls -lah dist/

      - name: Verify dist folder
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'assets/app-' dist/index.html
          echo "Built bundle: $(grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)"

      - name: Validate frontend FTP credentials
        run: |
          SERVER="${{ secrets.FTP_SERVER }}"
          USER="${{ secrets.FTP_USERNAME }}"
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD must be set."
            exit 1
          fi
          if echo "$SERVER$USER" | grep -qi 'yellow-cobra'; then
            echo "::error::These look like BACKEND (yellow-cobra) FTP credentials."
            echo "::error::This workflow deploys the FRONTEND site (lightsteelblue) only."
            exit 1
          fi
          echo "Using frontend FTP host (masked by GitHub)"

      - name: Prepare FTP server path
        id: ftp
        run: |
          DIR="${{ secrets.REMOTE_DIR }}"
          USER="${{ secrets.FTP_USERNAME }}"
          # Hostinger: FTP login root IS public_html. Always deploy to /, never /public_html/.
          if [ -z "$DIR" ] || [ "$DIR" = "/public_html" ] || [ "$DIR" = "/public_html/" ] || [ "$DIR" = "./" ] || [ "$DIR" = "." ] || echo "$USER" | grep -q 'hostingersite.com'; then
            DIR="/"
          fi
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "FTP server-dir: $DIR"
          if echo "${{ secrets.FTP_SERVER }}" | grep -qE '^[0-9.]+$'; then
            echo "ftp_protocol=ftp" >> "$GITHUB_OUTPUT"
            echo "Using plain FTP (IP host avoids SSL certificate mismatch)"
          else
            echo "ftp_protocol=${{ secrets.FTP_PROTOCOL || 'ftp' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy to Hostinger FTP
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          set -euo pipefail
          SERVER="${{ secrets.FTP_SERVER }}"
          USER="${{ secrets.FTP_USERNAME }}"
          PASS="${{ secrets.FTP_PASSWORD }}"
          PORT="${{ secrets.FTP_PORT || 21 }}"
          # Plain FTP only — never TLS when host is an IP (SSL cert mismatch).
          echo "Deploying frontend/dist via passive FTP to ftp://${SERVER}:${PORT}/"
          cd frontend/dist
          file_count=$(find . -type f | wc -l | tr -d ' ')
          echo "Files to upload: $file_count"
          failed=0
          uploaded=0
          upload_file() {
            local file="$1"
            local rel="${file#./}"
            local remote="/${rel}"
            echo "↑ ${rel}"
            if curl --ftp-create-dirs --ftp-pasv --connect-timeout 30 --max-time 300 --retry 2 --fail \
              -T "$file" --user "${USER}:${PASS}" \
              "ftp://${SERVER}:${PORT}${remote}"; then
              uploaded=$((uploaded + 1))
            else
              echo "::error::FTP upload failed: ${rel}"
              failed=$((failed + 1))
            fi
          }
          # Upload /assets first so index.html never points at missing JS/CSS.
          while IFS= read -r file; do
            upload_file "$file"
          done < <(find ./assets -type f 2>/dev/null | sort)
          while IFS= read -r file; do
            upload_file "$file"
          done < <(find . -type f ! -path './assets/*' ! -name 'index.html' | sort)
          upload_file "./index.html"
          echo "Uploaded ${uploaded}/${file_count} files (${failed} failed)"
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

      - name: Verify live site updated
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          SITE="${SITE_URL:-https://dineshcattlefeed.com}"
          SITE="${SITE%/}"
          BUILT=$(grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$BUILT" ]; then
            echo "::error::Could not read bundle name from dist/index.html"
            exit 1
          fi
          echo "Deployed bundle should be: $BUILT"
          sleep 15
          LIVE_HTML=$(curl -sL --max-time 30 -H "Cache-Control: no-cache" "$SITE/index.html")
          LIVE=$(echo "$LIVE_HTML" | grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' | head -1)
          echo "Live site bundle: $LIVE"
          JS_URL="$SITE/$LIVE"
          JS_BODY=$(curl -sL --max-time 30 "$JS_URL" | head -c 20)
          JS_SIZE=$(curl -sL --max-time 30 "$JS_URL" | wc -c | tr -d ' ')
          echo "Live bundle size: $JS_SIZE bytes (starts with: ${JS_BODY//[$'\n\r']/})"
          if [ "$BUILT" = "$LIVE" ] && [ "$JS_SIZE" -gt 10000 ] && ! echo "$JS_BODY" | grep -qi '<!doctype'; then
            echo "Live site matches deployed build"
          else
            echo "::error::Live bundle missing or invalid ($LIVE vs $BUILT, size: $JS_SIZE)."
            exit 1
          fi

      - name: Skip FTP (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — skipping FTP upload"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
