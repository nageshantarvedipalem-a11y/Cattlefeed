# =============================================================================
# Hostinger Shared Hosting — Frontend CI/CD (FTP)
# =============================================================================
# Triggers : push to main, manual dispatch
# Deploys  : frontend/dist/ → Hostinger public_html via FTP/FTPS
# Secrets  : FTP_* , VITE_API_BASE_URL , SITE_URL
# =============================================================================

name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build only, no FTP upload)'
        required: false
        default: false
        type: boolean

# Do not cancel in-progress runs — rapid pushes were marking deploys as failed.
concurrency:
  group: hostinger-frontend-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  WORKING_DIRECTORY: frontend

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Lint frontend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm run lint

      - name: Build production bundle
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: Cattle Feed ERP
          VITE_API_PROJECT: cattlefeed
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL secret is not set."
            exit 1
          fi
          npm run build
          ls -lah dist/

      - name: Verify dist folder
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'assets/index-' dist/index.html
          echo "Built bundle: $(grep -o 'assets/index-[^\"]*\\.js' dist/index.html | head -1)"

      - name: Deploy to Hostinger FTP
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./frontend/dist/
          server-dir: ${{ secrets.REMOTE_DIR }}
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Verify live site updated
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && secrets.SITE_URL != '' }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true
        run: |
          BUILT=$(grep -o 'assets/index-[^\"]*\\.js' dist/index.html | head -1)
          echo "Deployed bundle should be: $BUILT"
          sleep 15
          LIVE=$(curl -sL --max-time 30 "$SITE_URL" | grep -o 'assets/index-[^\"]*\\.js' | head -1)
          echo "Live site bundle: $LIVE"
          if [ "$BUILT" = "$LIVE" ]; then
            echo "✅ Live site matches deployed build"
          else
            echo "::warning::Live site still shows old bundle."
            echo "::warning::Fix GitHub secret REMOTE_DIR — try: /public_html"
            echo "::warning::Or: /domains/lightsteelblue-bison-593262.hostingersite.com/public_html"
          fi

      - name: Skip FTP (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — skipping FTP upload"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
