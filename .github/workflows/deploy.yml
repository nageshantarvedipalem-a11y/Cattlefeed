# =============================================================================
# Cattle Feed — Production deploy (frontend + backend SPA)
# =============================================================================
# On every push to main:
#   1. Build React frontend
#   2. Copy into backend/public and push → Hostinger Node (yellow-cobra) redeploys
#      API + SPA together from Git
#   3. FTP upload to dineshcattlefeed.com when DOMAIN_FTP_* secrets are set
#      (or FTP_* if those credentials are for the custom-domain website)
#
# ONE-TIME (required for domain auto-updates without domain FTP):
#   hPanel → assign dineshcattlefeed.com to yellow-cobra Node website.
#   After that, every git push updates the domain automatically.
#
# Secrets:
#   VITE_API_BASE_URL   (required)  yellow-cobra API URL
#   DOMAIN_FTP_*        (optional)  FTP for dineshcattlefeed.com website
#   FTP_*               (optional)  fallback FTP (prefer domain site, not lightsteelblue)
#   SITE_URL            (optional)  default https://dineshcattlefeed.com
# =============================================================================

name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only (no git sync / FTP)'
        required: false
        default: false
        type: boolean

concurrency:
  group: cattlefeed-production-deploy
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  CUSTOM_DOMAIN: https://dineshcattlefeed.com
  NODE_SITE: https://yellow-cobra-125039.hostingersite.com

jobs:
  build-and-deploy:
    name: Build, sync Node SPA, FTP domain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Avoid infinite loop when this workflow commits backend/public
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: Cattle Feed ERP
          VITE_API_PROJECT: cattlefeed
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Set GitHub secret VITE_API_BASE_URL (e.g. ${{ env.NODE_SITE }}/api/cattlefeed/v1)"
            exit 1
          fi
          npm run build
          test -f dist/index.html
          test -d dist/assets
          BUNDLE=$(grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "BUILT_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "Built: $BUNDLE"

      - name: Sync frontend into backend/public (Node SPA)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          set -euo pipefail
          rm -rf backend/public/assets backend/public/images
          mkdir -p backend/public
          rsync -a --delete \
            --exclude '.gitkeep' \
            frontend/dist/ backend/public/
          # Keep any server-only files if present later
          echo "Synced frontend/dist → backend/public ($BUILT_BUNDLE)"
          ls -lah backend/public/ | head -20

      - name: Commit & push SPA for Hostinger Node auto-deploy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend/public
          if git diff --cached --quiet; then
            echo "backend/public already up to date — Hostinger Node has current SPA"
            exit 0
          fi
          git commit -m "chore: sync production frontend to backend/public [skip ci]

          Bundle: ${BUILT_BUNDLE}
          "
          git push origin HEAD:main
          echo "Pushed backend/public — Hostinger yellow-cobra will redeploy API + SPA"

      - name: Resolve FTP credentials (prefer domain website)
        id: ftp
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          DOMAIN_FTP_SERVER: ${{ secrets.DOMAIN_FTP_SERVER }}
          DOMAIN_FTP_USERNAME: ${{ secrets.DOMAIN_FTP_USERNAME }}
          DOMAIN_FTP_PASSWORD: ${{ secrets.DOMAIN_FTP_PASSWORD }}
          DOMAIN_FTP_PORT: ${{ secrets.DOMAIN_FTP_PORT }}
          DOMAIN_FTP_PROTOCOL: ${{ secrets.DOMAIN_FTP_PROTOCOL }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          # Prefer DOMAIN_FTP_* (dineshcattlefeed.com). Fall back to FTP_*.
          if [ -n "${DOMAIN_FTP_SERVER:-}" ] && [ -n "${DOMAIN_FTP_USERNAME:-}" ] && [ -n "${DOMAIN_FTP_PASSWORD:-}" ]; then
            echo "mode=domain" >> "$GITHUB_OUTPUT"
            PROTOCOL="${DOMAIN_FTP_PROTOCOL:-ftp}"
            SERVER="$DOMAIN_FTP_SERVER"
            echo "Using DOMAIN_FTP_* for dineshcattlefeed.com"
          elif [ -n "${FTP_SERVER:-}" ] && [ -n "${FTP_USERNAME:-}" ] && [ -n "${FTP_PASSWORD:-}" ]; then
            if echo "${FTP_USERNAME}${FTP_SERVER}" | grep -qi 'yellow-cobra'; then
              echo "::warning::FTP_* looks like yellow-cobra — skipping FTP (Node Git deploy handles that site)."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            PROTOCOL="${FTP_PROTOCOL:-ftp}"
            SERVER="$FTP_SERVER"
            echo "Using FTP_* — replace with DOMAIN_FTP_* from dineshcattlefeed.com if domain stays stale"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::No FTP secrets — relying on Hostinger Node Git + domain → yellow-cobra."
            exit 0
          fi
          if echo "$SERVER" | grep -qE '^[0-9.]+$'; then
            PROTOCOL=ftp
          fi
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"

      - name: FTP upload frontend to Hostinger
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && steps.ftp.outputs.mode != 'skip' && steps.ftp.outputs.mode != '' }}
        env:
          FTP_MODE: ${{ steps.ftp.outputs.mode }}
          FTP_PROTOCOL: ${{ steps.ftp.outputs.protocol || 'ftp' }}
          DOMAIN_FTP_SERVER: ${{ secrets.DOMAIN_FTP_SERVER }}
          DOMAIN_FTP_USERNAME: ${{ secrets.DOMAIN_FTP_USERNAME }}
          DOMAIN_FTP_PASSWORD: ${{ secrets.DOMAIN_FTP_PASSWORD }}
          DOMAIN_FTP_PORT: ${{ secrets.DOMAIN_FTP_PORT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          if [ "$FTP_MODE" = "domain" ]; then
            FTP_SERVER="$DOMAIN_FTP_SERVER"
            FTP_USERNAME="$DOMAIN_FTP_USERNAME"
            FTP_PASSWORD="$DOMAIN_FTP_PASSWORD"
            FTP_PORT="${DOMAIN_FTP_PORT:-21}"
          else
            FTP_PORT="${FTP_PORT:-21}"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          cd frontend/dist

          PROTOCOL_SETTINGS='set ftp:ssl-allow no;'
          OPEN_URL="ftp://${FTP_SERVER}:${FTP_PORT}"
          if [ "${FTP_PROTOCOL}" = "ftps" ]; then
            PROTOCOL_SETTINGS='set ftp:ssl-force true; set ssl:verify-certificate no;'
            OPEN_URL="ftps://${FTP_SERVER}:${FTP_PORT}"
          fi

          deploy_to() {
            local target="$1"
            case "$target" in
              */) ;;
              *) target="${target}/" ;;
            esac
            echo "FTP → ${target}"
            lftp -c "
              ${PROTOCOL_SETTINGS}
              set ftp:passive-mode true;
              set net:max-retries 4;
              set net:reconnect-interval-base 8;
              set net:timeout 60;
              set net:connection-limit 1;
              set cmd:fail-exit true;
              open -u '${FTP_USERNAME}','${FTP_PASSWORD}' ${OPEN_URL};
              mirror -R --verbose --parallel=1 --no-perms --exclude-glob index.html ./ ${target};
              put -O ${target} index.html;
              bye
            "
          }

          ok=0
          for attempt in 1 2 3 4 5; do
            if deploy_to "/"; then
              ok=1
              break
            fi
            sleep $((attempt * 12))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::FTP upload failed"
            exit 1
          fi

          # Best-effort addon paths (main-account FTP only)
          for target in /domains/dineshcattlefeed.com/public_html /domains/www.dineshcattlefeed.com/public_html; do
            deploy_to "$target" || echo "::warning::No access to $target"
          done

      - name: Verify live hosts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          FTP_MODE: ${{ steps.ftp.outputs.mode }}
        run: |
          set -uo pipefail
          BUILT="$BUILT_BUNDLE"
          if [ -z "$BUILT" ]; then
            BUILT=$(grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' frontend/dist/index.html | head -1)
          fi
          echo "Expecting: $BUILT"

          {
            [ -n "${SITE_URL:-}" ] && echo "${SITE_URL%/}"
            echo "${CUSTOM_DOMAIN}"
            echo "https://www.dineshcattlefeed.com"
            echo "${NODE_SITE}"
          } | awk 'NF && !seen[$0]++' > /tmp/verify-sites.txt

          site_has_build() {
            local site="$1" html live js_size js_head
            html=$(curl -sL --max-time 25 -A "CattleFeedDeploy/1.0" -H "Cache-Control: no-cache" "$site/?v=$RANDOM" || true)
            live=$(printf '%s' "$html" | grep -oE 'assets/app-[A-Za-z0-9_-]+\.js' | head -1 || true)
            if [ -z "$live" ]; then
              echo "  $site -> no bundle"
              return 1
            fi
            js_head=$(curl -sL --max-time 25 -A "CattleFeedDeploy/1.0" "$site/$live" | head -c 32 || true)
            js_size=$(curl -sL --max-time 25 -A "CattleFeedDeploy/1.0" "$site/$live" | wc -c | tr -d ' ')
            echo "  $site -> $live (${js_size} bytes)"
            [ "$BUILT" = "$live" ] && [ "${js_size:-0}" -gt 10000 ] && ! printf '%s' "$js_head" | grep -qi '<!doctype'
          }

          NODE_OK=0
          DOMAIN_OK=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Verify attempt $attempt/8..."
            sleep 10
            NODE_OK=0
            DOMAIN_OK=0
            while IFS= read -r site; do
              if site_has_build "$site"; then
                if printf '%s' "$site" | grep -qi 'yellow-cobra'; then
                  NODE_OK=1
                fi
                if printf '%s' "$site" | grep -qi 'dineshcattlefeed.com'; then
                  DOMAIN_OK=1
                fi
              fi
            done < /tmp/verify-sites.txt

            if [ "$DOMAIN_OK" = "1" ]; then
              echo "SUCCESS: custom domain serves $BUILT"
              exit 0
            fi
            if [ "$NODE_OK" = "1" ] && [ "${FTP_MODE:-skip}" = "domain" ]; then
              echo "Node OK; waiting for domain FTP to propagate..."
              continue
            fi
            if [ "$NODE_OK" = "1" ] && [ "$attempt" -ge 5 ]; then
              break
            fi
          done

          if [ "$DOMAIN_OK" = "1" ]; then
            exit 0
          fi

          if [ "$NODE_OK" = "1" ]; then
            echo "::error::yellow-cobra has $BUILT but dineshcattlefeed.com does not."
            echo "::error::ONE-TIME FIX (then every git push auto-updates the domain):"
            echo "::error::  hPanel → Websites → yellow-cobra → Domains → add/assign dineshcattlefeed.com"
            echo "::error::OR set GitHub secrets DOMAIN_FTP_SERVER / DOMAIN_FTP_USERNAME / DOMAIN_FTP_PASSWORD"
            echo "::error::  from hPanel → Websites → dineshcattlefeed.com → FTP Accounts"
            exit 1
          fi

          echo "::error::Neither domain nor yellow-cobra is serving $BUILT yet."
          echo "::error::Check Hostinger Node Git deploy is connected to this repo, then Redeploy."
          exit 1

      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — built $BUILT_BUNDLE only"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Bundle | \`${BUILT_BUNDLE:-n/a}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Node SPA | \`backend/public\` → yellow-cobra Git |"
            echo "| Domain | dineshcattlefeed.com (DOMAIN_FTP_* or point DNS/site at yellow-cobra) |"
          } >> "$GITHUB_STEP_SUMMARY"
