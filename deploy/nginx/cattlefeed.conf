# Nginx config for Cattle Feed ERP on Hostinger VPS
# Copy to: /etc/nginx/sites-available/cattlefeed
# Enable:  sudo ln -sf /etc/nginx/sites-available/cattlefeed /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx

# Replace YOUR_DOMAIN with your actual domain (e.g. lightsteelblue-bison-593262.hostingersite.com)
server {
    listen 80;
    server_name lightsteelblue-bison-593262.hostingersite.com;

    # Frontend (React build)
    root /var/www/cattlefeed/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    # API → Node.js backend (PM2)
    location /api/cattlefeed/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React Router — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# After SSL certificate (recommended):
# sudo apt install certbot python3-certbot-nginx -y
# sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN
